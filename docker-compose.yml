# Acoustic Analyzer — hooks into your EXISTING Ollama (does not start a second one).
#   docker compose up -d --build
#
# Assumes Ollama already listens on the host at :11434 (your running pod). If Ollama lives on a
# specific docker network instead, see the note at the bottom.

services:
  acoustic:
    build: .
    environment:
      ACOUSTIC_DEMO: "1"          # no mic yet -> synthetic signal. Set "0" once the board is wired.
    ports:
      - "8000:8000"
    # --- uncomment when the USB audio adapter is plugged in ---
    # devices:
    #   - /dev/snd:/dev/snd
    # group_add:
    #   - audio
    restart: unless-stopped

  # OPTIONAL — delete this whole service if you already run Open WebUI elsewhere;
  # instead just add the tool server http://<jetson-ip>:8000 in your existing Open WebUI.
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434   # reuse your running Ollama
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3000:8080"
    volumes:
      - open-webui:/app/backend/data
    depends_on:
      - acoustic
    restart: unless-stopped

volumes:
  open-webui:

# --- Alternative: join your existing docker network instead of using the host port ---
# 1) find the network:   docker network ls
# 2) give each service:  networks: [ default, <that-network> ]
# 3) point Open WebUI at the ollama service name: OLLAMA_BASE_URL=http://<ollama-service>:11434
# 4) declare it external at the bottom:
# networks:
#   <that-network>:
#     external: true
