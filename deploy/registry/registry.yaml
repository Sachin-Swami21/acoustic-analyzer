# Shared container registry — its OWN namespace, independent of any app (acoustic or otherwise).
# NodePort is cluster-wide, so every namespace pushes/pulls at sachin-jetson.local:30500.
#   kubectl apply -f deploy/registry/registry.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: registry
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: registry-data
  namespace: registry
spec:
  accessModes: [ ReadWriteOnce ]
  storageClassName: local-path        # on the NVMe
  resources:
    requests:
      storage: 15Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: registry
spec:
  replicas: 1
  selector:
    matchLabels: { app: registry }
  template:
    metadata:
      labels: { app: registry }
    spec:
      containers:
        - name: registry
          image: registry:2
          ports:
            - containerPort: 5000
          env:
            - { name: REGISTRY_STORAGE_DELETE_ENABLED, value: "true" }
          volumeMounts:
            - { name: data, mountPath: /var/lib/registry }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: registry-data
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: registry
spec:
  type: NodePort
  selector: { app: registry }
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30500          # push/pull at sachin-jetson.local:30500
