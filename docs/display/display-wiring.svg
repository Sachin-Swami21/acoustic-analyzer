<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760"><rect width="1000" height="760" fill="#ffffff"/>
<text x="500" y="40" font-family="ui-monospace,Menlo,monospace" font-size="19" font-weight="700" text-anchor="middle" fill="#1a1a22">Sound-reactive display — OLED + LED-bar wiring</text>
<text x="500" y="64" font-family="-apple-system,Segoe UI,sans-serif" font-size="12" text-anchor="middle" fill="#6a6f7d">Jetson 40-pin → SSD1306 OLED (I²C) + APA102 LED bar (SPI, via 74AHCT125 3.3→5 V shifter)</text>

<!-- Jetson header -->
<rect x="50" y="120" width="210" height="380" rx="8" fill="#eef2ff" stroke="#6c8ebf" stroke-width="2"/>
<text x="155" y="146" font-family="ui-monospace,Menlo,monospace" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a22">JETSON — 40-pin</text>
<text x="155" y="163" font-family="-apple-system,Segoe UI,sans-serif" font-size="10" text-anchor="middle" fill="#6a6f7d">Orin Nano</text>
<text x="66" y="196" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#33383f">pin 1&#160;&#160;3.3V</text>
<text x="66" y="222" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#33383f">pin 2&#160;&#160;5V</text>
<text x="66" y="248" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#33383f">pin 3&#160;&#160;SDA</text>
<text x="66" y="274" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#33383f">pin 5&#160;&#160;SCL</text>
<text x="66" y="330" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#33383f">pin 19&#160;MOSI</text>
<text x="66" y="356" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#33383f">pin 23&#160;SCK</text>
<text x="66" y="470" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#33383f">pin 6/20 GND</text>
<circle cx="248" cy="192" r="4" fill="#d9760a"/><circle cx="248" cy="218" r="4" fill="#e5484d"/><circle cx="248" cy="244" r="4" fill="#0b9a8d"/><circle cx="248" cy="270" r="4" fill="#0b9a8d"/><circle cx="248" cy="326" r="4" fill="#d6206e"/><circle cx="248" cy="352" r="4" fill="#3b6fd6"/><circle cx="248" cy="466" r="4.5" fill="#3a3f4b"/>

<!-- OLED -->
<rect x="560" y="120" width="180" height="120" rx="8" fill="#e6f4ea" stroke="#2f9e44" stroke-width="2"/>
<text x="650" y="150" font-family="ui-monospace,Menlo,monospace" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a22">SSD1306 OLED</text>
<text x="650" y="167" font-family="-apple-system,Segoe UI,sans-serif" font-size="10" text-anchor="middle" fill="#6a6f7d">128×64 · I²C · 0x3C</text>
<text x="574" y="196" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#33383f">VCC (3.3V)</text>
<text x="574" y="214" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#33383f">SDA</text>
<text x="574" y="232" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#33383f">SCL / GND</text>

<!-- Level shifter -->
<rect x="470" y="300" width="210" height="150" rx="8" fill="#fff4e6" stroke="#d9760a" stroke-width="2"/>
<text x="575" y="328" font-family="ui-monospace,Menlo,monospace" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a22">74AHCT125</text>
<text x="575" y="345" font-family="-apple-system,Segoe UI,sans-serif" font-size="10" text-anchor="middle" fill="#6a6f7d">3.3 V in → 5 V out buffer</text>
<text x="484" y="372" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#33383f">1A(2)◄MOSI&#160;&#160;1Y(3)►DI</text>
<text x="484" y="392" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#33383f">2A(5)◄SCK&#160;&#160;&#160;2Y(6)►CI</text>
<text x="484" y="416" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#33383f">VCC(14)=5V&#160;&#160;GND(7)</text>
<text x="484" y="436" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#33383f">OE1,OE2(1,4)→GND · 0.1µF</text>

<!-- LED bar -->
<rect x="760" y="300" width="200" height="150" rx="8" fill="#fdecec" stroke="#e5484d" stroke-width="2"/>
<text x="860" y="328" font-family="ui-monospace,Menlo,monospace" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a22">APA102 LED bar</text>
<text x="860" y="345" font-family="-apple-system,Segoe UI,sans-serif" font-size="10" text-anchor="middle" fill="#6a6f7d">DotStar · SPI (clocked)</text>
<text x="776" y="372" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#33383f">5V · GND</text>
<text x="776" y="392" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#33383f">DI ◄ data</text>
<text x="776" y="410" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#33383f">CI ◄ clock</text>
<circle cx="792" cy="430" r="5" fill="#2f9e44"/><circle cx="812" cy="430" r="5" fill="#2f9e44"/><circle cx="832" cy="430" r="5" fill="#f0b400"/><circle cx="852" cy="430" r="5" fill="#f0b400"/><circle cx="872" cy="430" r="5" fill="#e5484d"/><circle cx="892" cy="430" r="5" fill="#e5484d"/>
<text x="905" y="434" font-family="ui-monospace,Menlo,monospace" font-size="10" fill="#6a6f7d">VU</text>

<!-- 3.3V wire pin1 -> OLED VCC -->
<path d="M248 192 L400 192" fill="none" stroke="#d9760a" stroke-width="3" stroke-linecap="round"/>
<path d="M400 192 L560 192" fill="none" stroke="#d9760a" stroke-width="3" stroke-linecap="round"/>
<text x="404" y="184" font-family="ui-monospace,Menlo,monospace" font-size="10" fill="#d9760a">3.3V</text>
<!-- I2C -->
<path d="M248 244 L540 244 L540 209 L560 209" fill="none" stroke="#0b9a8d" stroke-width="3" stroke-linecap="round"/>
<path d="M248 270 L520 270 L520 227 L560 227" fill="none" stroke="#0b9a8d" stroke-width="3" stroke-linecap="round"/>
<text x="360" y="238" font-family="ui-monospace,Menlo,monospace" font-size="10" fill="#0b9a8d">SDA / SCL (I²C)</text>

<!-- 5V wire pin2 -> shifter VCC + LED 5V -->
<path d="M248 218 L300 218 L300 415 L470 415" fill="none" stroke="#e5484d" stroke-width="3" stroke-linecap="round"/>
<path d="M300 290 L720 290 L720 366 L760 366" fill="none" stroke="#e5484d" stroke-width="3" stroke-linecap="round"/>
<circle cx="300" cy="290" r="4.5" fill="#e5484d"/>
<text x="305" y="284" font-family="ui-monospace,Menlo,monospace" font-size="10" fill="#e5484d">+5V rail</text>

<!-- MOSI pin19 -> shifter 1A -->
<path d="M248 326 L430 326 L430 372 L470 372" fill="none" stroke="#d6206e" stroke-width="3" stroke-linecap="round"/>
<text x="330" y="320" font-family="ui-monospace,Menlo,monospace" font-size="10" fill="#d6206e">MOSI (data)</text>
<!-- SCK pin23 -> shifter 2A -->
<path d="M248 352 L410 352 L410 392 L470 392" fill="none" stroke="#3b6fd6" stroke-width="3" stroke-linecap="round"/>
<text x="330" y="366" font-family="ui-monospace,Menlo,monospace" font-size="10" fill="#3b6fd6">SCK (clock)</text>

<!-- shifter out 1Y -> LED DI -->
<path d="M680 372 L720 372 L720 392 L760 392" fill="none" stroke="#d6206e" stroke-width="3" stroke-linecap="round"/>
<!-- shifter out 2Y -> LED CI -->
<path d="M680 392 L705 392 L705 410 L760 410" fill="none" stroke="#3b6fd6" stroke-width="3" stroke-linecap="round"/>
<text x="690" y="366" font-family="ui-monospace,Menlo,monospace" font-size="9" fill="#6a6f7d">5V logic</text>

<!-- Ground rail -->
<path d="M248 466 L940 466" fill="none" stroke="#3a3f4b" stroke-width="4" stroke-linecap="round"/>
<path d="M650 240 L650 466" fill="none" stroke="#3a3f4b" stroke-width="3" stroke-linecap="round"/>
<path d="M575 450 L575 466" fill="none" stroke="#3a3f4b" stroke-width="3" stroke-linecap="round"/>
<path d="M792 450 L792 466" fill="none" stroke="#3a3f4b" stroke-width="3" stroke-linecap="round"/>
<circle cx="650" cy="466" r="4.5" fill="#3a3f4b"/><circle cx="575" cy="466" r="4.5" fill="#3a3f4b"/><circle cx="792" cy="466" r="4.5" fill="#3a3f4b"/>
<text x="248" y="488" font-family="ui-monospace,Menlo,monospace" font-size="11" font-weight="700" fill="#3a3f4b">GND — one common rail (Jetson · OLED · 74AHCT125 pin7 · LED bar all tie here)</text>

<!-- checklist -->
<rect x="50" y="540" width="910" height="180" rx="10" fill="#faf8f5" stroke="#e2ded4" stroke-width="1.5"/>
<text x="70" y="566" font-family="ui-monospace,Menlo,monospace" font-size="12" font-weight="700" fill="#d6206e">BUILD CHECKLIST — in order</text>
<text x="70" y="590" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#33383f">1  Enable spi1: sudo jetson-io.py → spi1 → reboot</text>
<text x="520" y="590" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#33383f">2  Socket the 74AHCT125; VCC=5V, GND, 0.1µF, OE1/OE2→GND</text>
<text x="70" y="612" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#33383f">3  OLED: pin1→VCC, pin3→SDA, pin5→SCL, pin6→GND  (i2cdetect → 0x3C)</text>
<text x="520" y="612" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#33383f">4  MOSI→1A, SCK→2A;  1Y→DI, 2Y→CI  (use the LED bar's IN end)</text>
<text x="70" y="634" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#33383f">5  330 Ω in series on DI; 470–1000 µF across LED 5V/GND</text>
<text x="520" y="634" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#33383f">6  16 LEDs → separate 5V supply, common ground</text>
<text x="70" y="656" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#33383f">7  Meter check: all GND continuous · 5V↔GND NO beep · 3.3V≠5V</text>
<text x="520" y="656" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#33383f">8  Drop chip in socket, power up, run software smoke test</text>
<text x="70" y="686" font-family="-apple-system,Segoe UI,sans-serif" font-size="11" fill="#6a6f7d">Colour key:  ORANGE 3.3V · RED 5V · TEAL I²C · MAGENTA SPI-data · BLUE SPI-clock · dark GND</text>
<text x="70" y="706" font-family="-apple-system,Segoe UI,sans-serif" font-size="11" fill="#6a6f7d">Data source: features.analyze() → band_energy (6 bars) + rms_db (VU). No new DSP.</text>
</svg>
