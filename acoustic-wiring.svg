<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720"><rect width="1000" height="720" fill="#ffffff"/><text x="500.0" y="42" font-family="ui-monospace,Menlo,monospace" font-size="20" font-weight="700" text-anchor="middle" fill="#1a1a22">Acoustic Analyzer — front-end wiring (what to solder)</text><text x="500.0" y="66" font-family="-apple-system,Segoe UI,sans-serif" font-size="12" text-anchor="middle" fill="#6a6f7d">mic → MAX9814 → 1 µF DC-block → 1 kΩ + 10 nF low-pass → 3.5 mm jack → USB adapter</text><rect x="60" y="150" width="150" height="110" rx="7" fill="#fdecec" stroke="#e5484d" stroke-width="2"/><text x="135.0" y="203.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" text-anchor="middle" fill="#1a1a22" font-weight="700">POWER</text><text x="135.0" y="220.0" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10" text-anchor="middle" fill="#6a6f7d">3-5 V</text><text x="135" y="300" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10" text-anchor="middle" fill="#6a6f7d">3xAA (4.5V) or USB 5V</text><rect x="300" y="120" width="190" height="200" rx="7" fill="#eef2ff" stroke="#6c8ebf" stroke-width="2"/><text x="395.0" y="218.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" text-anchor="middle" fill="#1a1a22" font-weight="700">MAX9814</text><text x="395.0" y="235.0" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10" text-anchor="middle" fill="#6a6f7d">(mic on board)</text><circle cx="395" cy="165" r="16" fill="#dfe7ff" stroke="#6c8ebf" stroke-width="2"/><text x="395" y="169" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="9" text-anchor="middle" fill="#4a5578">MIC</text><rect x="540" y="168" width="64" height="44" rx="7" fill="#fff4e6" stroke="#d9760a" stroke-width="2"/><text x="572.0" y="188.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" text-anchor="middle" fill="#1a1a22" font-weight="700">1 µF</text><text x="572.0" y="205.0" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10" text-anchor="middle" fill="#6a6f7d">DC block</text><text x="548" y="163" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="15" text-anchor="middle" fill="#d9760a" font-weight="700">+</text><rect x="648" y="168" width="64" height="44" rx="7" fill="#fff4e6" stroke="#d9760a" stroke-width="2"/><text x="680.0" y="188.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" text-anchor="middle" fill="#1a1a22" font-weight="700">1 kΩ</text><text x="680.0" y="205.0" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10" text-anchor="middle" fill="#6a6f7d">low-pass</text><rect x="735" y="360" width="64" height="44" rx="7" fill="#fff4e6" stroke="#d9760a" stroke-width="2"/><text x="767.0" y="380.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" text-anchor="middle" fill="#1a1a22" font-weight="700">10 nF</text><text x="767.0" y="397.0" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10" text-anchor="middle" fill="#6a6f7d">to GND</text><rect x="830" y="150" width="120" height="120" rx="7" fill="#e6f4ea" stroke="#2f9e44" stroke-width="2"/><text x="890.0" y="208.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" text-anchor="middle" fill="#1a1a22" font-weight="700">3.5 mm</text><text x="890.0" y="225.0" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10" text-anchor="middle" fill="#6a6f7d">plug (TRS)</text><text x="890" y="405" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" text-anchor="middle" fill="#2f9e44">→ USB adapter → Jetson</text><path d="M210 180 L255 180 L255 175 L300 175" fill="none" stroke="#e5484d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="240" y="168" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" text-anchor="middle" fill="#e5484d">+5 V</text><path d="M210 245 L210 560" fill="none" stroke="#3a3f4b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M300 270 L258 270 L258 560" fill="none" stroke="#3a3f4b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="395" y="300" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" text-anchor="middle" fill="#6c8ebf">GAIN pin → VDD  = 40 dB gain</text><path d="M490 190 L540 190" fill="none" stroke="#d6206e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="512" y="181" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" text-anchor="middle" fill="#d6206e">signal</text><path d="M604 190 L648 190" fill="none" stroke="#d6206e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M712 190 L772 190" fill="none" stroke="#d6206e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><circle cx="772" cy="190" r="4.5" fill="#d6206e"/><path d="M772 190 L830 190" fill="none" stroke="#d6206e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="806" y="181" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" text-anchor="middle" fill="#d6206e">TIP</text><path d="M772 190 L772 360" fill="none" stroke="#d6206e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M767 404 L767 560" fill="none" stroke="#3a3f4b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M830 250 L810 250 L810 560" fill="none" stroke="#3a3f4b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="806" y="243" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" text-anchor="end" fill="#3a3f4b">SLEEVE</text><path d="M190 560 L860 560" fill="none" stroke="#3a3f4b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="190" y="582" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" text-anchor="start" fill="#3a3f4b" font-weight="700">GND — common ground rail (all grounds tie here)</text><circle cx="210" cy="560" r="4.5" fill="#3a3f4b"/><circle cx="258" cy="560" r="4.5" fill="#3a3f4b"/><circle cx="767" cy="560" r="4.5" fill="#3a3f4b"/><circle cx="810" cy="560" r="4.5" fill="#3a3f4b"/><rect x="60" y="600" width="880" height="96" rx="10" fill="#faf8f5" stroke="#e2ded4" stroke-width="1.5"/><text x="80" y="626" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" text-anchor="start" fill="#d6206e" font-weight="700">SOLDER CHECKLIST — in order</text><text x="80" y="650" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" text-anchor="start" fill="#33383f">1  Solder header pins onto the MAX9814 board</text><text x="520" y="650" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" text-anchor="start" fill="#33383f">2  Power: +V → VDD,  GND → GND rail</text><text x="80" y="670" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" text-anchor="start" fill="#33383f">3  Tie GAIN pin → VDD  (sets 40 dB, avoids clipping)</text><text x="520" y="670" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" text-anchor="start" fill="#33383f">4  1 µF DC-block: + leg toward MAX9814 OUT</text><text x="80" y="690" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" text-anchor="start" fill="#33383f">5  1 µF → 1 kΩ in series (OUT → cap → resistor)</text><text x="520" y="690" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" text-anchor="start" fill="#33383f">6  10 nF from that junction down to GND</text><text x="80" y="710" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" text-anchor="start" fill="#33383f">7  Junction → jack TIP</text><text x="520" y="710" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" text-anchor="start" fill="#33383f">8  GND rail → jack SLEEVE</text></svg>