<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1020" viewBox="0 0 960 1020"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#333"/></marker></defs><rect width="960" height="1020" fill="white"/><text x="480.0" y="34" font-family="Helvetica,Arial,sans-serif" font-size="18" text-anchor="middle" fill="#222" font-weight="700">Acoustic Analyzer - a local edge-AI that hears and explains sound</text><text x="480.0" y="56" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle" fill="#666" font-style="italic">Jetson Orin Nano + Ollama qwen2.5:3b + Open WebUI  -  the LLM never sees raw audio, only the JSON facts from features.analyze()</text><rect x="40" y="80" width="250" height="470" rx="8" fill="none" stroke="#B3B3B3" stroke-width="1.5" stroke-dasharray="6 4"/><text x="165.0" y="100" font-family="Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle" fill="#555" font-weight="700">1. ANALOG FRONT-END  (son solders)</text><rect x="320" y="80" width="330" height="470" rx="8" fill="none" stroke="#B3B3B3" stroke-width="1.5" stroke-dasharray="6 4"/><text x="485.0" y="100" font-family="Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle" fill="#555" font-weight="700">2. JETSON  -  DSP + LLM  (you code)</text><rect x="680" y="80" width="250" height="470" rx="8" fill="none" stroke="#B3B3B3" stroke-width="1.5" stroke-dasharray="6 4"/><text x="805.0" y="100" font-family="Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle" fill="#555" font-weight="700">3. CHAT UI</text><rect x="95" y="135" width="160" height="38" rx="6" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/><text x="175.0" y="159.0" font-family="Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle" fill="#222">Electret mic capsule</text><rect x="95" y="190" width="160" height="44" rx="6" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/><text x="175.0" y="217.0" font-family="Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle" fill="#222">MAX9814 AGC preamp</text><line x1="175" y1="173" x2="175" y2="190" stroke="#d79b00" stroke-width="1.5" marker-end="url(#a)"/><rect x="95" y="249" width="160" height="44" rx="6" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/><text x="175.0" y="276.0" font-family="Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle" fill="#222">Anti-alias RC filter</text><line x1="175" y1="234" x2="175" y2="249" stroke="#d79b00" stroke-width="1.5" marker-end="url(#a)"/><rect x="95" y="308" width="160" height="38" rx="6" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/><text x="175.0" y="332.0" font-family="Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle" fill="#222">3.5 mm jack</text><line x1="175" y1="293" x2="175" y2="308" stroke="#d79b00" stroke-width="1.5" marker-end="url(#a)"/><rect x="95" y="362" width="160" height="44" rx="6" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/><text x="175.0" y="389.0" font-family="Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle" fill="#222">USB audio adapter (~$8)</text><line x1="175" y1="346" x2="175" y2="362" stroke="#d79b00" stroke-width="1.5" marker-end="url(#a)"/><rect x="350" y="135" width="260" height="44" rx="6" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><text x="480.0" y="154.5" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle" fill="#222">Stage 1: capture_test.py</text><text x="480.0" y="168.5" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle" fill="#222">record / VU meter</text><rect x="350" y="200" width="260" height="44" rx="6" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><text x="480.0" y="219.5" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle" fill="#222">Stage 2: spectrogram.py</text><text x="480.0" y="233.5" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle" fill="#222">live FFT spectrogram</text><rect x="350" y="265" width="260" height="58" rx="6" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><text x="480.0" y="285.0" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="middle" fill="#222">Stage 3: features.analyze() -&gt; JSON</text><text x="480.0" y="298.0" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="middle" fill="#222">dominant Hz, peaks, band energy,</text><text x="480.0" y="311.0" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="middle" fill="#222">60 Hz hum, spectral centroid</text><rect x="350" y="345" width="260" height="78" rx="6" fill="#f8cecc" stroke="#b85450" stroke-width="1.5" stroke-dasharray="6 4"/><text x="480.0" y="368.5" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="middle" fill="#222">Stage 4-5: Ollama + qwen2.5:3b</text><text x="480.0" y="381.5" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="middle" fill="#222">LLM tools over analyze():</text><text x="480.0" y="394.5" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="middle" fill="#222">capture_and_analyze(),</text><text x="480.0" y="407.5" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="middle" fill="#222">get_spectrum_image(), classify_sound()</text><text x="355" y="437" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="start" fill="#b85450" font-style="italic">not built yet</text><line x1="480" y1="179" x2="480" y2="200" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/><line x1="480" y1="244" x2="480" y2="265" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/><line x1="480" y1="323" x2="480" y2="345" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/><line x1="255" y1="384" x2="350" y2="157" stroke="#333" stroke-width="2" marker-end="url(#a)"/><text x="302.5" y="265.5" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="middle" fill="#555" font-style="italic">USB audio ~44.1 kHz</text><rect x="700" y="135" width="200" height="54" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" stroke-dasharray="6 4"/><text x="800.0" y="153.0" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="middle" fill="#222">Open WebUI</text><text x="800.0" y="166.0" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="middle" fill="#222">(browser chat, renders</text><text x="800.0" y="179.0" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="middle" fill="#222">the spectrogram image)</text><rect x="700" y="210" width="200" height="210" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><text x="712" y="232" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="start" fill="#222">&quot;What&#x27;s that noise?&quot;</text><text x="712" y="250" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="start" fill="#222"></text><text x="712" y="268" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="start" fill="#222">-&gt; records 2s, analyzes</text><text x="712" y="286" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="start" fill="#222">-&gt; { dominant: 60 Hz,</text><text x="712" y="304" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="start" fill="#222">     harmonics: 120/180,</text><text x="712" y="322" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="start" fill="#222">     label: &#x27;mains hum&#x27; }</text><text x="712" y="340" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="start" fill="#222"></text><text x="712" y="358" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="start" fill="#222">LLM: &quot;60 Hz mains hum -</text><text x="712" y="376" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="start" fill="#222">likely a ground loop.</text><text x="712" y="394" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="start" fill="#222">Here&#x27;s the spectrum.&quot;</text><line x1="610" y1="384" x2="700" y2="165" stroke="#333" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/><text x="655.0" y="269.5" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="middle" fill="#555" font-style="italic">chat + tools</text><text x="40" y="590" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="start" fill="#222" font-weight="700">Legend:</text><rect x="105" y="580" width="20" height="16" rx="6" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><text x="131" y="592" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="start" fill="#222">Built, runs on Mac (Stages 1-3)</text><rect x="360" y="580" width="20" height="16" rx="6" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/><text x="386" y="592" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="start" fill="#222">Hardware - son solders</text><rect x="545" y="580" width="20" height="16" rx="6" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/><text x="571" y="592" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="start" fill="#222">Not built yet (Stage 4-5)</text><rect x="745" y="580" width="20" height="16" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><text x="771" y="592" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="start" fill="#222">Chat front-end</text><line x1="40" y1="625" x2="920" y2="625" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4"/><text x="480.0" y="670" font-family="Helvetica,Arial,sans-serif" font-size="15" text-anchor="middle" fill="#222" font-weight="700">Options considered in the design chat  (chosen = green)</text><rect x="360" y="695" width="240" height="50" rx="6" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/><text x="480.0" y="717.5" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle" fill="#222" font-weight="700">Jetson + local LLM + chat UI</text><text x="480.0" y="731.5" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle" fill="#222">for an EE student&#x27;s project</text><rect x="680" y="695" width="250" height="50" rx="6" fill="#f5f5f5" stroke="#999999" stroke-width="1.5"/><text x="805.0" y="717.5" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="middle" fill="#222">Pre-pivot: generic sensors -&gt;</text><text x="805.0" y="730.5" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="middle" fill="#222">soldered ESP32 node (dropped)</text><line x1="600" y1="720" x2="680" y2="720" stroke="#999" stroke-width="1.5" marker-end="url(#a)"/><text x="640.0" y="715.0" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="middle" fill="#555" font-style="italic">superseded</text><rect x="40" y="790" width="210" height="80" rx="6" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><text x="145.0" y="821.0" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="middle" fill="#222" font-weight="700">Acoustic Analyzer [CHOSEN]</text><text x="145.0" y="834.0" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="middle" fill="#222">mic+preamp, FFT/spectrogram,</text><text x="145.0" y="847.0" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="middle" fill="#222">sound classifier</text><line x1="480" y1="745" x2="145" y2="790" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/><rect x="270" y="790" width="210" height="80" rx="6" fill="#ffffff" stroke="#666666" stroke-width="1.5"/><text x="375.0" y="821.0" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="middle" fill="#222">Analog Filter &amp; Bode Lab</text><text x="375.0" y="834.0" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="middle" fill="#222">op-amp filters, plot</text><text x="375.0" y="847.0" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="middle" fill="#222">transfer function</text><line x1="480" y1="745" x2="375" y2="790" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/><rect x="500" y="790" width="210" height="80" rx="6" fill="#ffffff" stroke="#666666" stroke-width="1.5"/><text x="605.0" y="821.0" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="middle" fill="#222">Biosignal / ECG Monitor</text><text x="605.0" y="834.0" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="middle" fill="#222">AD8232, Pan-Tompkins</text><text x="605.0" y="847.0" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="middle" fill="#222">R-peak, heart rate</text><line x1="480" y1="745" x2="605" y2="790" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/><rect x="730" y="790" width="210" height="80" rx="6" fill="#ffffff" stroke="#666666" stroke-width="1.5"/><text x="835.0" y="821.0" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="middle" fill="#222">RF / SDR Explorer</text><text x="835.0" y="834.0" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="middle" fill="#222">RTL-SDR, FFT waterfall,</text><text x="835.0" y="847.0" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="middle" fill="#222">AM/FM demod</text><line x1="480" y1="745" x2="835" y2="790" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/><text x="480.0" y="905" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#222" font-weight="700">Mic front-end paths for the Acoustic Analyzer</text><rect x="40" y="925" width="210" height="70" rx="6" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><text x="145.0" y="951.0" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="middle" fill="#222" font-weight="700">Path A [CHOSEN]</text><text x="145.0" y="964.0" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="middle" fill="#222">electret + MAX9814 -&gt; USB</text><text x="145.0" y="977.0" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="middle" fill="#222">most analog learning</text><line x1="145" y1="870" x2="145" y2="925" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/><rect x="270" y="925" width="210" height="70" rx="6" fill="#ffffff" stroke="#666666" stroke-width="1.5"/><text x="375.0" y="951.0" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="middle" fill="#222">Path B</text><text x="375.0" y="964.0" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="middle" fill="#222">INMP441 I2S mic -&gt; Jetson</text><text x="375.0" y="977.0" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="middle" fill="#222">device-tree tinkering</text><line x1="145" y1="870" x2="375" y2="925" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/><rect x="500" y="925" width="210" height="70" rx="6" fill="#ffffff" stroke="#666666" stroke-width="1.5"/><text x="605.0" y="951.0" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="middle" fill="#222">Path C</text><text x="605.0" y="964.0" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="middle" fill="#222">INMP441 + ESP32 wireless</text><text x="605.0" y="977.0" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="middle" fill="#222">Stage-2 upgrade</text><line x1="145" y1="870" x2="605" y2="925" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/></svg>